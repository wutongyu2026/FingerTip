name: Release Sync

# 触发：tag push (v*.*.*)
# 流程：tag → build (Windows + Linux + macOS) → GitHub Release → Pages 部署
# 验证意图：手动维护 release 太容易漏；tag 一次推送全链路自动。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # 允许手动触发（测试或紧急 release）

permissions:
  contents: write        # 创建 Release
  pages: write           # 部署 Pages
  id-token: write        # OIDC（Pages 部署新方式）
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ───────────────────────────────────────────────
  # 1. 构建 Windows MSI + NSIS 双格式安装包
  # ───────────────────────────────────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: .
        run: pnpm typecheck

      - name: Vitest
        working-directory: .
        run: pnpm test

      - name: Engine pytest (mock 默认；不依赖真实模型)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -v

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FingerTip ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }} — see CHANGELOG.md"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '--target x86_64-pc-windows-msvc' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fingertip-${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: warn

  # ───────────────────────────────────────────────
  # 2. Pages 部署（landing.html + docs/ 静态站）
  # ───────────────────────────────────────────────
  deploy-pages:
    name: Deploy landing to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp docs/landing.html _site/landing.html
          cp docs/algorithm-explainer.html _site/algorithm-explainer.html 2>/dev/null || true
          cp docs/plans/*.md _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────
  # 3. release 状态汇总（PR 评论 / commit status）
  # ───────────────────────────────────────────────
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-tauri, deploy-pages]
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "## FingerTip ${{ github.ref_name }} release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tauri builds: ${{ needs.build-tauri.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pages deploy: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 安装包见 GitHub Release artifacts" >> $GITHUB_STEP_SUMMARY
          echo "🌐 落地页见 Pages deployment URL" >> $GITHUB_STEP_SUMMARY
